name: vivoo Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: vivoo-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: ${{ matrix.label }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            command: dist:mac
            artifact: macos
          - label: Windows
            os: windows-latest
            command: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.12.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
      - name: Configure optional code signing
        shell: bash
        env:
          VIVOO_CSC_LINK: ${{ matrix.artifact == 'macos' && secrets.MACOS_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
          VIVOO_CSC_KEY_PASSWORD: ${{ matrix.artifact == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$VIVOO_CSC_LINK" ]; then
            echo "CSC_LINK=$VIVOO_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$VIVOO_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              echo "No Developer ID configured; sealing the pilot build with a complete ad-hoc signature."
            else
              echo "No signing certificate configured; building an unsigned Windows pilot installer."
            fi
          fi
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.12
      - name: Package capture runtime
        shell: bash
        run: uv run --python 3.12 --with-editable 'apps/capture-agent[vision]' --with pyinstaller python apps/desktop/scripts/build-agent.py
      - name: Fetch pose model
        shell: bash
        run: uv run --python 3.12 --with ultralytics==8.4.137 python -c "from ultralytics import YOLO; YOLO('yolo26n-pose.pt')"
      - name: Prepare native video runtime
        run: pnpm --dir apps/desktop runtime:prepare
      - name: Validate bundled detector
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            apps/desktop/runtime/agent/courtvision-agent/courtvision-agent.exe --resources apps/desktop/runtime --self-test
          else
            apps/desktop/runtime/agent/courtvision-agent/courtvision-agent --resources apps/desktop/runtime --self-test
          fi
      - name: Build installer
        run: pnpm --dir apps/desktop ${{ matrix.command }}
      - name: Stage and validate automatic-update feed
        run: pnpm --dir apps/desktop update:stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vivoo-desktop-${{ matrix.artifact }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
            infra/deploy/desktop-updates/**
          if-no-files-found: error

  publish-update-feed:
    name: Publish automatic updates
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vivoo-desktop-*
          path: /tmp/vivoo-release
          merge-multiple: true
      - name: Publish HTTPS update channel on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_DIR=/tmp/vivoo-release/apps/desktop/dist
          test -d "$RELEASE_DIR"
          mapfile -t RELEASE_FILES < <(find "$RELEASE_DIR" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print)
          test "${#RELEASE_FILES[@]}" -gt 0
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "vivoo ${GITHUB_REF_NAME#desktop-v}" --notes "Actualización automática de vivoo para macOS y Windows."
          gh release upload "$GITHUB_REF_NAME" "${RELEASE_FILES[@]}" --clobber
