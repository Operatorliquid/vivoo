server {
    listen 8080;
    server_name _;
    client_max_body_size 2g;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /desktop-updates/ {
        alias /srv/desktop-updates/;
        autoindex off;
        add_header Cache-Control "public, max-age=300" always;
    }

    # El shell de la SPA debe revalidarse siempre para que las instalaciones
    # de escritorio reciban cambios de marca y funcionalidad al abrirse.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite genera nombres con hash: estos archivos sí se pueden cachear por un año.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
